    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BFE9D4"/><stop offset=".45" stop-color="#19C37D"/><stop offset="1" stop-color="#0F5132"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="600" fill="#10241A"/>
