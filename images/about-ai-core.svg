<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Abstract artificial intelligence network</title>
  <desc id="desc">A glowing emerald neural network core with connected data nodes.</desc>
  <defs>
